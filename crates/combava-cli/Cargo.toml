[package]
name = "combava-cli"
description = "Générateur de PDF à partir de markdown, opinioné, basé sur Typst"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "combava"
path = "src/main.rs"

[dependencies]
combava-core = { path = "../combava-core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
include_dir = "0.7.4"
toml = { version = "1.1.8", default-features = false, features = ["parse", "std"] }
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", features = [
    "datetime",
    "embedded-fonts",
    "scan-fonts",
    "system-downloader",
    "system-packages",
] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
